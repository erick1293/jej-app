<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Personal - App JEJ</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .acciones-personal { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .btn-edit { background:#2563eb; color:#fff; border:0; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:700; }
      .personal-vacio { color:#64748b; font-size:13px; margin:4px 0; }
      @media(max-width:600px) { .item-pers { align-items:flex-start; gap:10px; flex-direction:column; } .acciones-personal { width:100%; } }
    </style>
  </head>
  <body class="pagina-fondo">
    <main class="card-wide">
      <h2>Gestión de Personal DET / JeJ</h2>
      <p class="subtitle">Administra supervisores y responsables por turno. Los módulos de captura mostrarán únicamente el personal habilitado para el turno seleccionado.</p>
      <form id="formPersonal" onsubmit="guardarPersonal(event)">
        <div class="form-group-field">
          <label for="tipoPersonal">Rol del Personal:</label>
          <select id="tipoPersonal" required>
            <option value="" disabled selected>-- Seleccione Rol --</option>
            <option value="supervisorJeJ">Supervisor JeJ (Ingeniero Líder P&amp;T)</option>
            <option value="supervisorDet">Supervisor DET / Jefe de Turno DET</option>
            <option value="responsableDet">Responsable Carguío DET / Encargado DET</option>
          </select>
        </div>
        <div class="form-group-field">
          <label for="turnoPersonal">Asociar a Turno:</label>
          <select id="turnoPersonal" required>
            <option value="" disabled selected>-- Seleccione Turno --</option>
            <option value="A">Turno A</option>
            <option value="B">Turno B</option>
            <option value="Ambos">Ambos Turnos</option>
          </select>
        </div>
        <div class="form-group-field">
          <label for="nombrePersonal">Nombre Completo:</label>
          <input type="text" id="nombrePersonal" placeholder="Nombre y apellido" required autocomplete="off" />
        </div>
        <button id="btnGuardarPersonal" type="submit" class="btn-primary" style="width:100%;background-color:#16a34a">+ Agregar Personal</button>
        <button id="btnCancelarEdicion" type="button" class="btn-primary" style="display:none;width:100%;margin-top:8px;background-color:#64748b" onclick="cancelarEdicionPersonal()">Cancelar edición</button>
      </form>
      <div class="listado-personal">
        <h3>Personal Registrado en Turnos</h3>
        <div id="contenedorLista">Cargando datos...</div>
      </div>
      <div style="margin-top:20px;text-align:center">
        <a href="../index.html" class="btn-primary" style="background-color:#64748b;text-decoration:none;display:inline-block;padding:10px 20px">Volver al Menú Principal</a>
      </div>
    </main>
    <script src="../js/components.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/usuarios.js"></script>
    <script>
      let personalEnEdicion = null;
      if (typeof cargarBarMenu === "function") cargarBarMenu(true);
      document.addEventListener("DOMContentLoaded", mostrarListadoPersonal);

      function guardarPersonal(evento) {
        evento.preventDefault();
        const rol = document.getElementById("tipoPersonal").value;
        const turno = document.getElementById("turnoPersonal").value;
        const nombre = document.getElementById("nombrePersonal").value.trim();
        if (!rol || !turno || !nombre) return;
        const mapa = JEJUsuarios.inicializar();
        const editando = personalEnEdicion;
        const repetido = mapa[rol].some((persona, indice) => {
          if (editando && rol === editando.rol && indice === editando.indice) return false;
          return persona.nombre.toLocaleLowerCase() === nombre.toLocaleLowerCase() && persona.turno === turno;
        });
        if (repetido) { alert("Este nombre ya está asignado a ese rol y turno."); return; }
        if (editando) mapa[editando.rol].splice(editando.indice, 1);
        mapa[rol].push({ nombre, turno });
        JEJUsuarios.guardar(mapa);
        cancelarEdicionPersonal();
        mostrarListadoPersonal();
      }

      function editarPersonal(rol, indice) {
        const persona = JEJUsuarios.inicializar()[rol][indice];
        if (!persona) return;
        personalEnEdicion = { rol, indice };
        document.getElementById("tipoPersonal").value = rol;
        document.getElementById("turnoPersonal").value = persona.turno;
        document.getElementById("nombrePersonal").value = persona.nombre;
        document.getElementById("btnGuardarPersonal").textContent = "✓ Guardar cambios";
        document.getElementById("btnCancelarEdicion").style.display = "block";
        document.getElementById("nombrePersonal").focus();
      }

      function cancelarEdicionPersonal() {
        personalEnEdicion = null;
        document.getElementById("formPersonal").reset();
        document.getElementById("btnGuardarPersonal").textContent = "+ Agregar Personal";
        document.getElementById("btnCancelarEdicion").style.display = "none";
      }

      function eliminarPersonal(rol, indice) {
        const mapa = JEJUsuarios.inicializar();
        const persona = mapa[rol] && mapa[rol][indice];
        if (!persona || !confirm(`¿Desea eliminar a "${persona.nombre}" del turno ${persona.turno}?`)) return;
        mapa[rol].splice(indice, 1);
        JEJUsuarios.guardar(mapa);
        if (personalEnEdicion && personalEnEdicion.rol === rol) cancelarEdicionPersonal();
        mostrarListadoPersonal();
      }

      function mostrarListadoPersonal() {
        const contenedor = document.getElementById("contenedorLista");
        const etiquetas = { supervisorJeJ:"Supervisor JeJ", supervisorDet:"Supervisor(es) DET", responsableDet:"Responsable(s) Carguío DET" };
        const mapa = JEJUsuarios.inicializar();
        contenedor.replaceChildren();
        let cantidad = 0;
        Object.keys(etiquetas).forEach(rol => mapa[rol].forEach((persona, indice) => {
          cantidad++;
          const fila = document.createElement("div"); fila.className = "item-pers";
          const identidad = document.createElement("div");
          const etiqueta = document.createElement("span"); etiqueta.className = "badge-rol"; etiqueta.textContent = etiquetas[rol];
          const nombre = document.createElement("strong"); nombre.textContent = persona.nombre;
          identidad.append(etiqueta, nombre);
          const acciones = document.createElement("div"); acciones.className = "acciones-personal";
          const badgeTurno = document.createElement("span"); badgeTurno.className = "badge-turno"; badgeTurno.textContent = persona.turno === "Ambos" ? "Turno A y B" : `Turno ${persona.turno}`;
          const editar = document.createElement("button"); editar.type = "button"; editar.className = "btn-edit"; editar.textContent = "Editar"; editar.onclick = () => editarPersonal(rol, indice);
          const quitar = document.createElement("button"); quitar.type = "button"; quitar.className = "btn-delete"; quitar.textContent = "Quitar"; quitar.onclick = () => eliminarPersonal(rol, indice);
          acciones.append(badgeTurno, editar, quitar); fila.append(identidad, acciones); contenedor.appendChild(fila);
        }));
        if (!cantidad) {
          const vacio = document.createElement("p"); vacio.className = "personal-vacio"; vacio.textContent = "No hay personal asignado. Agrega supervisores y responsables por turno."; contenedor.appendChild(vacio);
        }
      }
    </script>
  </body>
</html>
