<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seguimiento a la Perforación - App JEJ</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="pagina-fondo" data-section="anfo">
    <!-- CONTENIDO ESPECÍFICO DE LA PÁGINA -->
    <main id="anfoMain" class="card-wide">
      <div id="toolbar"></div>

      <section class="anfo-perforacion-paso card-wide" id="paso"></section>
    </main>

    <!-- Librería para generar el Excel (.xlsx) -->
    <!-- Estructura base del modal: su contenido específico se completa desde JavaScript. -->
    <template id="plantillaModalJej">
      <div class="anfo-perforacion-ov modal-overlay" data-modal-overlay>
        <section
          class="anfo-perforacion-modal modal-content"
          role="dialog"
          aria-modal="true"
          data-modal-content
        ></section>
      </div>
    </template>
    <button type="button" id="btn-subir-onedrive" hidden>
      Subir archivos de Perforación a OneDrive
    </button>
    <input
      type="file"
      id="onedrive-archivos-perforacion"
      accept=".xlsx,.html,.htm,.pdf"
      multiple
      hidden
    />
    <script src="../js/usuarios.js"></script>
    <script src="../js/vendor/exceljs.min.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/msal-browser.js"></script>
    <script src="../js/onedrive-integration.js"></script>

    <script src="../js/capacitor-plugins.js"></script>
    <script src="../js/archivo-movil.js"></script>
    <script src="../js/perforacion.js"></script>
    <script>
      if (typeof cargarBarMenu === "function") cargarBarMenu(true); // true = está en una subcarpeta (pages/)
    </script>
  </body>
</html>
