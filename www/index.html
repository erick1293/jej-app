<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App JEJ - Gestión Offline</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="con-hero">
    <style>
        #jejStartupSplash{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;background:#0b1c43;opacity:1;transition:opacity .35s ease}
        #jejStartupSplash img{display:block;width:min(100vw,540px);height:auto;max-height:94vh;max-height:94dvh;object-fit:contain}
        #jejStartupSplash.oculto{opacity:0;pointer-events:none}
    </style>
    <div id="jejStartupSplash" aria-label="Cargando aplicación"><img src="img/pantalla%20de%20inicio.png" alt="JEJ Ingeniería Consciente"></div>
    <script>(()=>{const splash=document.getElementById('jejStartupSplash');const inicio=Date.now();let oculto=false;const cerrar=()=>{if(oculto)return;oculto=true;setTimeout(()=>{splash.classList.add('oculto');setTimeout(()=>splash.remove(),400)},Math.max(0,700-(Date.now()-inicio)))};window.addEventListener('load',cerrar,{once:true});setTimeout(cerrar,3500)})();</script>

    <!-- BANNER DE BIENVENIDA -->
    <section class="hero" id="hero">
        <div class="hero-text">
          <span class="b">Innovación tecnológica</span>
             <span class="l">para crear valor</span>
            <span class="b">y un futuro sostenible</span>
        </div>
        <svg class="hero-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 40 C 240 100, 560 118, 900 84 C 1140 58, 1300 30, 1440 52 L1440 120 L0 120 Z" fill="#e6ebf1"/>
            <path d="M0 62 C 260 112, 600 112, 940 76 C 1180 52, 1310 36, 1440 60 L1440 120 L0 120 Z" fill="#f4f6f8"/>
        </svg>
    </section>

    <!-- CONTENIDO PRINCIPAL CENTRADO -->
    <main class="container-center">

        <!-- SECCIÓN 1: VISTA DE LOGIN -->
        <section id="seccionLogin" class="card login-card">
            <h2>Identificación de Usuario</h2>
            <p class="subtitle">Ingrese o seleccione su usuario responsable (sin clave)</p>
            
            <div class="form-group">
                <label for="usuarioInput">Usuario Responsable:</label>
                <input type="text" id="usuarioInput" list="listaUsuarios" placeholder="Escriba su nombre..." autocomplete="off">
                <datalist id="listaUsuarios">
                </datalist>
            </div>

            <button class="btn-primary" onclick="ingresarApp()">Ingresar</button>
        </section>

        <section id="seccionMenu" class="card login-card process-menu" style="display: none;">
            <div class="user-info-header">
                <p>Usuario Activo: <strong id="usuarioLogueado">Cargando...</strong></p>
            </div>

            <h2>Selección de Proceso</h2>
            <p class="subtitle">Seleccione el tipo de seguimiento que desea realizar</p>

            <div class="process-options" aria-label="Opciones de seguimiento">
                <button class="process-option" type="button" onclick="navegarA('anfo.html')">
                    <span class="process-icon" aria-hidden="true">▲</span>
                    <span class="process-copy"><strong>Seguimiento al carguio con anfo</strong></span>
                    <span class="process-arrow" aria-hidden="true">›</span>
                </button>
                <button class="process-option" type="button" onclick="navegarA('emulsion.html')">
                    <span class="process-icon" aria-hidden="true">◆</span>
                    <span class="process-copy"><strong>Seguimiento al carguio con Emulsion</strong></span>
                    <span class="process-arrow" aria-hidden="true">›</span>
                </button>
                <button class="process-option" type="button" onclick="navegarA('reduccion.html')">
                    <span class="process-icon" aria-hidden="true">▼</span>
                    <span class="process-copy"><strong>Seguimiento a la reduccion secundaria</strong></span>
                    <span class="process-arrow" aria-hidden="true">›</span>
                </button>
                <button class="process-option" type="button" onclick="navegarA('perforacion.html')">
                    <span class="process-icon" aria-hidden="true">✦</span>
                    <span class="process-copy"><strong>Seguimiento al carguio con perforacion</strong></span>
                    <span class="process-arrow" aria-hidden="true">›</span>
                </button>
                <button class="process-option" type="button" onclick="navegarA('usuarios.html')">
                    <span class="process-icon" aria-hidden="true">⚙</span>
                    <span class="process-copy"><strong>Gestionar Personal (DET / JeJ)</strong></span>
                    <span class="process-arrow" aria-hidden="true">›</span>
                </button>
            </div>
        </section>

    </main>

  <script src="./js/components.js"></script>
<script src="./js/app.js"></script>

<script>
    if (typeof cargarBarMenu === 'function') {
        cargarBarMenu(false);
    }
</script>
</body>
</html>
