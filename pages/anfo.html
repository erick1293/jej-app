<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento ANFO - App JEJ</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group-field {
            display: flex;
            flex-direction: column;
        }
        .form-group-field label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            color: #1e293b;
        }
        .form-group-field input, .form-group-field select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        .card-wide {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 20px auto;
        }
        .section-title {
            font-size: 18px;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-top: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <main class="card-wide">
        <h2>Seguimiento al Carguío con Anfo</h2>
        <p class="subtitle">Registro automatizado de terreno</p>

        <form id="formAnfo" onsubmit="guardarRegistroAnfo(event)">
            
            <!-- DATOS GENERALES Y AUTOMÁTICOS -->
            <div class="section-title">1. Datos Generales y Turno</div>
            <div class="form-grid">
                <div class="form-group-field">
                    <label for="fechaAnfo">Fecha:</label>
                    <input type="text" id="fechaAnfo" readonly style="background-color: #f1f5f9;">
                </div>
                <div class="form-group-field">
                    <label for="turnoAnfo">Turno:</label>
                    <select id="turnoAnfo" required>
                        <option value="" disabled selected>-- Seleccione Turno --</option>
                        <option value="A">Turno A</option>
                        <option value="B">Turno B</option>
                    </select>
                </div>
            </div>

            <!-- PERSONAL RESPONSABLE (AUTOMATIZADO) -->
            <div class="section-title">2. Personal Responsable</div>
            <div class="form-grid">
                <div class="form-group-field">
                    <label for="supervisorJeJ">Supervisor JeJ:</label>
                    <input type="text" id="supervisorJeJ" placeholder="Nombre Supervisor JeJ">
                </div>
                <div class="form-group-field">
                    <label for="encargadoSeguimiento">Encargado Seguimiento JeJ:</label>
                    <input type="text" id="encargadoSeguimiento" readonly style="background-color: #f1f5f9; font-weight: bold; color: #2563eb;">
                    <small style="color: #64748b; margin-top: 3px;">(Cargado automáticamente desde tu Login)</small>
                </div>
                <div class="form-group-field">
                    <label for="supervisorDet">Supervisor DET:</label>
                    <input type="text" id="supervisorDet" list="listaSupDet" placeholder="Escriba o seleccione...">
                    <datalist id="listaSupDet">
                        <option value="Andrés Bugeño">
                        <option value="Otro Supervisor">
                    </datalist>
                </div>
                <div class="form-group-field">
                    <label for="responsableDet">Responsable Carguío DET:</label>
                    <input type="text" id="responsableDet" list="listaRespDet" placeholder="Escriba o seleccione...">
                    <datalist id="listaRespDet">
                        <option value="Sergio guerrero">
                    </datalist>
                </div>
            </div>

            <!-- ACCIONES -->
            <div style="display: flex; gap: 10px; margin-top: 30px;">
                <button type="submit" class="btn-primary" style="flex: 2;">Guardar Registro Anfo</button>
                <a href="../index.html" class="btn-primary" style="flex: 1; background-color: #64748b; text-align: center; text-decoration: none; line-height: normal; display: flex; align-items: center; justify-content: center;">Volver</a>
            </div>
        </form>
    </main>

    <script src="../js/components.js"></script>
    <script src="../js/app.js"></script>
    <script>
        cargarBarMenu(true);

        // Automatizar fecha actual y usuario logueado al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Asignar fecha actual (DD/MM/YYYY)
            const hoy = new Date();
            const fechaFormateada = String(hoy.getDate()).padStart(2, '0') + '/' + 
                                    String(hoy.getMonth() + 1).padStart(2, '0') + '/' + 
                                    hoy.getFullYear();
            const inputFecha = document.getElementById("fechaAnfo");
            if (inputFecha) inputFecha.value = fechaFormateada;

            // 2. Cargar el usuario activo desde el localStorage al campo de encargado
            const usuarioActivo = localStorage.getItem("jej_usuario_activo");
            const inputEncargado = document.getElementById("encargadoSeguimiento");
            if (inputEncargado && usuarioActivo) {
                inputEncargado.value = usuarioActivo;
            }
        });

        function guardarRegistroAnfo(e) {
            e.preventDefault();
            alert("¡Registro de ANFO guardado localmente con éxito!");
            // Aquí puedes programar la lógica para exportarlo a Excel o guardarlo en almacenamiento offline
        }
    </script>
</body>
</html>
