<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento a la Perforación - App JEJ</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
/* Estilos de la página de seguimiento (se cargan DESPUÉS de styles.css) */
.jp-page { max-width: 100%; padding: 16px 20px 48px; box-sizing: border-box; color: #0f172a; font-family: inherit; }
.jp-page h1 { font-size: 1.25rem; margin: 4px 0 2px; }
.jp-page h2 { font-size: 1rem; margin: 22px 0 8px; }
.jp-sub { color: #475569; font-size: .85rem; margin: 0 0 12px; }
.jp-titulo-pagina { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.jp-menu-link { font-size: .85rem; color: #1e293b; background: #e2e8f0; padding: 6px 12px; border-radius: 6px; text-decoration: none; }
.jp-menu-link:hover { background: #cbd5e1; }
[hidden] { display: none !important; }

/* Barra superior */
.jp-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
.jp-tb-label { font-size: .85rem; display: flex; gap: 6px; align-items: center; }
.jp-toolbar select { max-width: 320px; }
.jp-sep { flex: 1; }
.jp-btn { border: 1px solid #cbd5e1; background: #fff; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: .85rem; }
.jp-btn:hover { background: #f1f5f9; }
.jp-btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
.jp-btn-primary:hover { background: #1d4ed8; }
.jp-btn-danger { color: #b91c1c; border-color: #fecaca; }
.jp-btn-grande { padding: 12px 20px; font-size: .95rem; font-weight: 600; }
.jp-btn[disabled] { opacity: .45; cursor: not-allowed; }

/* Flujo por pasos */
.jp-pasos { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; list-style: none; margin: 14px 0 16px; padding: 0; }
.jp-pasos button { display: flex; align-items: center; gap: 7px; padding: 5px 13px 5px 5px; border: 1px solid #cbd5e1; background: #fff; border-radius: 999px; font-size: .82rem; cursor: pointer; color: #334155; }
.jp-pasos .n { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; display: grid; place-items: center; font-size: .75rem; font-weight: 700; }
.jp-pasos .activo { border-color: #2563eb; background: #eff6ff; color: #1e3a8a; font-weight: 700; }
.jp-pasos .activo .n { background: #2563eb; color: #fff; }
.jp-pasos .hecho .n { background: #16a34a; color: #fff; }
.jp-paso { max-width: 820px; margin: 0 auto; }
.jp-paso-titulo { margin: 0 0 4px; font-size: 1.15rem; text-align: center; }
.jp-paso-ayuda { color: #475569; font-size: .85rem; margin: 0 0 14px; text-align: center; }
.jp-navpaso { display: flex; justify-content: space-between; gap: 8px; max-width: 820px; margin: 18px auto 0; }

/* Bloques de datos (Identificación, Horarios, Labor): tarjetas centradas */
.jp-bloque { border: 1px solid #dbe3ee; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
.jp-bloque > h3 { margin: 0; padding: 12px 16px; font-size: .95rem; text-align: center; background: #f1f5f9; border-bottom: 1px solid #dbe3ee; }
.jp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; padding: 16px; }
.jp-campo { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 10px 12px 12px; background: #f0f6fd; border: 1px solid #dbe7f6; border-top: 4px solid #93c5fd; border-radius: 10px; min-width: 0; }
.jp-campo.verde { background: #effcef; border-color: #cdeccd; border-top-color: #4ade80; }
.jp-campo.amar { background: #fff9e0; border-color: #f3e6a8; border-top-color: #fbbf24; }
.jp-campo label { font-size: .78rem; font-weight: 700; color: #334155; text-align: center; letter-spacing: .02em; }
.jp-campo input, .jp-campo select, .jp-campo output { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 10px; min-height: 44px; font-size: 1rem; text-align: center; text-align-last: center; background: #fff; min-width: 0; width: 100%; box-sizing: border-box; color: #0f172a; }
.jp-campo output { display: flex; align-items: center; justify-content: center; font-weight: 700; background: #fff7d6; border-color: #f3e6a8; }
.jp-campo input:focus, .jp-campo select:focus { outline: 3px solid rgba(37,99,235,.25); border-color: #2563eb; }
.jp-doble { grid-column: 1 / -1; }
.jp-par { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Registro por tiro: una pregunta a la vez */
.jp-q { border: 1px solid #cbd5e1; border-left-width: 8px; border-radius: 10px; background: #fff; padding: 14px 16px 14px; }
.jp-q-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: .8rem; color: #475569; flex-wrap: wrap; }
.jp-q-top b { color: #0f172a; font-size: .9rem; }
.jp-q-top select { font-size: .8rem; max-width: 230px; }
.jp-q-barra { height: 5px; background: #e2e8f0; border-radius: 3px; margin: 8px 0 14px; overflow: hidden; }
.jp-q-barra i { display: block; height: 100%; background: #2563eb; }
.jp-q h3 { margin: 0 0 2px; font-size: 1.2rem; text-align: center; }
.jp-q-ayuda { margin: 0; font-size: .8rem; color: #64748b; text-align: center; }
.jp-q-input { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px auto 8px; max-width: 420px; }
.jp-q-input input { flex: 1; text-align: center; font-size: 1.4rem; padding: 12px 12px; border: 1px solid #94a3b8; border-radius: 8px; min-width: 0; box-sizing: border-box; }
.jp-q-input input:focus { outline: 2px solid #2563eb; border-color: #2563eb; }
.jp-q-input .u { color: #64748b; font-size: .95rem; min-width: 34px; }
.jp-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 14px auto 8px; max-width: 520px; }
.jp-opt { padding: 14px 10px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; cursor: pointer; font-size: .95rem; }
.jp-opt:hover { background: #f1f5f9; }
.jp-opt.sel { background: #2563eb; border-color: #2563eb; color: #fff; }
.jp-q-calc { display: block; text-align: center; width: fit-content; margin-left: auto; margin-right: auto; background: #fff7d6; border-radius: 6px; padding: 6px 10px; font-size: .85rem; font-weight: 700; margin: 4px 0; }
.jp-q-error { color: #b91c1c; font-size: .82rem; margin: 4px 0; text-align: center; }
.jp-q-acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; justify-content: center; }
.jp-chip { border: 1px dashed #94a3b8; background: #f8fafc; border-radius: 999px; padding: 4px 10px; font-size: .78rem; cursor: pointer; color: #334155; }
.jp-chip:hover { background: #e2e8f0; }
.jp-q-resumen { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin-top: 14px; padding-top: 10px; border-top: 1px solid #e2e8f0; }
.jp-q-resumen span { font-size: .72rem; background: #f1f5f9; border-radius: 4px; padding: 2px 6px; color: #334155; }
.jp-aviso { background: #dcfce7; color: #166534; border-radius: 8px; padding: 8px 12px; font-size: .88rem; margin-bottom: 10px; }
.jp-vacio { border: 1px dashed #94a3b8; border-radius: 8px; padding: 18px; color: #475569; font-size: .9rem; background: #f8fafc; margin-bottom: 12px; }

/* Tablas simples */
.jp-scroll { overflow: auto; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; margin-bottom: 12px; }
.jp-tabla-simple { border-collapse: collapse; font-size: .85rem; width: 100%; }
.jp-tabla-simple th, .jp-tabla-simple td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: center; white-space: nowrap; }
.jp-tabla-simple th { background: #f1f5f9; }
.jp-tabla-simple tfoot td { background: #fff7d6; font-weight: 700; }
.jp-x { border: 0; background: transparent; color: #94a3b8; cursor: pointer; font-size: 1.1rem; padding: 0 6px; }
.jp-x:hover { color: #b91c1c; }
.jp-link { border: 0; background: none; color: #2563eb; cursor: pointer; font-size: .85rem; padding: 0 4px; }
.jp-link:hover { text-decoration: underline; }

/* Pérdida operacional */
.jp-perd { border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #fff; }
.jp-perd-head { background: #fce4d6; font-weight: 700; font-size: .85rem; padding: 7px 10px; display: grid; grid-template-columns: 1fr 110px 30px; gap: 8px; }
.jp-perd-fila { display: grid; grid-template-columns: 1fr 110px 30px; border-top: 1px solid #e2e8f0; align-items: stretch; }
.jp-perd-fila input { border: 0; padding: 9px 10px; font-size: .9rem; min-width: 0; width: 100%; box-sizing: border-box; background: transparent; }
.jp-perd-fila input:focus { outline: 2px solid #2563eb; outline-offset: -2px; background: #fff; }
.jp-perd-fila input.t { border-left: 1px solid #e2e8f0; text-align: center; }
.jp-perd-total { padding: 10px 12px; font-weight: 700; font-size: .95rem; text-align: right; background: #fff7d6; border-top: 1px solid #e2e8f0; }
.jp-perd-total small { font-weight: 400; color: #475569; margin-left: 6px; }
.jp-perd-pie { padding: 8px 10px; border-top: 1px solid #e2e8f0; }

/* Finalizar */
.jp-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
.jp-kpi { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; background: #fff; }
.jp-kpi b { display: block; font-size: 1.3rem; }
.jp-kpi span { font-size: .75rem; color: #475569; }
.jp-obs { margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; }
.jp-obs > div { background: #fff2cc; text-align: center; font-weight: 700; font-size: .8rem; padding: 6px; }
.jp-obs input { display: block; width: 100%; border: 0; border-top: 1px solid #e2e8f0; padding: 8px 10px; box-sizing: border-box; font-size: .88rem; }
.jp-opciones { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: .85rem; margin: 10px 0; }
.jp-descargas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* ===== Flujo tipo tarjeta: datos → ID de trabajo → paradas ===== */
.jp-paso { max-width: 560px; }
.jp-card { background: #fff; border-radius: 16px; padding: 22px 20px; box-shadow: 0 2px 12px rgba(15,23,42,.10); }
.jp-card-t { margin: 0; font-size: 1.4rem; text-align: left; line-height: 1.25; }
.jp-card-sub { margin: 3px 0 14px; color: #64748b; font-size: .88rem; }
.jp-lbl { display: block; font-weight: 700; font-size: .85rem; margin: 14px 0 6px; color: #1e293b; }
.jp-in { width: 100%; box-sizing: border-box; min-height: 46px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; background: #fff; color: #0f172a; font-family: inherit; }
.jp-in.gris { background: #f0f4fa; }
.jp-in.salida { display: flex; align-items: center; background: #fff7d6; border-color: #f3e6a8; font-weight: 700; }
.jp-in:focus { outline: 3px solid rgba(37,99,235,.25); border-color: #2563eb; }
.jp-sec { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; }
.jp-sec span { font-size: 1.02rem; }
.jp-resumen-box { margin-top: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; font-size: .88rem; line-height: 1.7; }
.jp-resumen-box hr { border: 0; border-top: 1px solid #cbd5e1; margin: 8px 0; }
.jp-b { display: block; width: 100%; border: 0; border-radius: 8px; padding: 13px 14px; font-size: .95rem; font-weight: 700; color: #fff; cursor: pointer; text-align: center; text-decoration: none; box-sizing: border-box; font-family: inherit; }
.jp-b:hover { filter: brightness(.93); }
.jp-b.gris { background: #64748b; } .jp-b.azul { background: #2563eb; } .jp-b.cel { background: #0284c7; }
.jp-b.verde { background: #16a34a; } .jp-b.nar { background: #d97706; } .jp-b.teal { background: #0d9488; }
.jp-b.rojo { background: #fee2e2; color: #b91c1c; } .jp-b.editar { background: #e0f2fe; color: #075985; }
.jp-b.chico { display: inline-block; width: auto; padding: 9px 14px; font-size: .85rem; }
.jp-fila2 { display: flex; gap: 10px; margin-top: 18px; }
.jp-fila2 > * { flex: 1; }
.jp-pila { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.jp-panel { background: #f0f4fa; border: 1px solid #cbd5e1; border-radius: 14px; padding: 16px; margin-top: 14px; }
.jp-panel-t { font-weight: 800; font-size: .85rem; letter-spacing: .02em; margin-bottom: 10px; color: #1e293b; }
.jp-parada { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.jp-parada:last-child { margin-bottom: 0; }
.jp-parada-t { font-weight: 800; font-size: 1.02rem; }
.jp-parada-s { font-size: .78rem; color: #64748b; }
.jp-parada-b { display: flex; gap: 6px; }
.jp-multi { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
.jp-lista-paradas .jp-vacio { margin: 0; }
.jp-card .jp-kpis { margin: 10px 0; }

/* Ventana modal */
.jp-ov { position: fixed; inset: 0; background: rgba(71,85,105,.82); display: flex; padding: 16px; overflow: auto; z-index: 1000; }
.jp-modal { background: #fff; border-radius: 14px; width: 100%; max-width: 560px; padding: 20px; margin: auto; box-shadow: 0 10px 30px rgba(15,23,42,.35); box-sizing: border-box; }
.jp-modal h3 { margin: 0; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; font-size: 1.15rem; }
.jp-modal h4 { margin: 18px 0 12px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; font-size: 1.02rem; font-weight: 400; }
.jp-mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.jp-mf { min-width: 0; }
.jp-mf.full { grid-column: 1 / -1; }
.jp-mf label { display: block; font-weight: 700; font-size: .8rem; margin-bottom: 5px; color: #1e293b; }
.jp-modal .jp-par { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jp-modal-acc { display: flex; gap: 10px; margin-top: 22px; }
.jp-modal-acc > * { flex: 1; }
@media (max-width: 420px) { .jp-mgrid { grid-template-columns: 1fr; } .jp-ov { padding: 8px; } }

/* ===== Ajustes: tabla de tiros sin scroll + modal de plantilla ===== */
.jp-paso { max-width: 900px; }
.jp-card { max-width: 560px; margin-left: auto; margin-right: auto; }
.jp-card.ancha { max-width: 900px; }
.jp-scroll.sin-scroll { overflow: visible; }
.jp-tabla-tiros { width: 100%; table-layout: auto; }
.jp-tabla-tiros th, .jp-tabla-tiros td { white-space: normal; word-break: break-word; padding: 8px 5px; font-size: .84rem; }
.jp-tabla-tiros th { font-size: .78rem; }
.jp-tabla-tiros .acc { display: flex; align-items: center; justify-content: center; gap: 2px; flex-wrap: nowrap; white-space: nowrap; }
@media (max-width: 480px) {
  .jp-page { padding-left: 8px; padding-right: 8px; }
  .jp-card { padding: 16px 10px; }
  .jp-tabla-tiros th, .jp-tabla-tiros td { padding: 6px 2px; font-size: .72rem; }
  .jp-tabla-tiros th { font-size: .68rem; }
  .jp-tabla-tiros .jp-link { padding: 0 2px; font-size: .72rem; }
}
.jp-descarga { margin-top: 12px; }
.jp-descarga small { display: block; text-align: center; color: #64748b; font-size: .78rem; margin-top: 8px; }

/* Modal de plantilla */
.jp-modal { max-width: 640px; }
.jp-modal-acc { position: sticky; bottom: 0; background: #fff; padding: 12px 0 2px; margin-top: 18px; border-top: 1px solid #e2e8f0; }
.pl-sec { border: 1px solid #dbe3ee; border-radius: 14px; margin-top: 14px; overflow: hidden; background: #fff; }
.pl-sec-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-weight: 800; font-size: .95rem; background: #f1f5f9; border-bottom: 1px solid #dbe3ee; }
.pl-sec.az .pl-sec-h { background: #e8f1fd; } .pl-sec.vd .pl-sec-h { background: #e7f8ea; }
.pl-sec.am .pl-sec-h { background: #fff4d6; } .pl-sec.rj .pl-sec-h { background: #fde9e0; }
.pl-sec-b { padding: 14px; }
.pl-sec-n { margin: 0 0 10px; font-size: .82rem; color: #64748b; }
.pl-fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.pl-fila:last-child { margin-bottom: 0; }
.pl-fila.t3 { grid-template-columns: 1fr 1fr; }
.pl-f { min-width: 0; }
.pl-f > .pl-l { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 22px; margin-bottom: 4px; font-weight: 700; font-size: .8rem; color: #1e293b; }
.pl-ahora { border: 0; background: #dbeafe; color: #1d4ed8; border-radius: 999px; padding: 2px 10px; font-size: .72rem; font-weight: 700; cursor: pointer; }
.pl-ahora:hover { background: #bfdbfe; }
.pl-grupo { font-weight: 800; font-size: .85rem; color: #334155; margin: 0 0 6px; }
.pl-grupo + .pl-fila { margin-bottom: 14px; }
.pl-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; padding-top: 12px; border-top: 1px dashed #cbd5e1; }
.pl-kpi { background: #fff7d6; border: 1px solid #f3e6a8; border-radius: 10px; padding: 8px 10px; text-align: center; }
.pl-kpi span { display: block; font-size: .72rem; color: #475569; font-weight: 700; }
.pl-kpi output { font-size: 1.3rem; font-weight: 800; color: #0f172a; }
.pl-y { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
.pl-y i { font-style: normal; color: #64748b; font-size: .85rem; }
.jp-modal .jp-in { min-height: 44px; }
.jp-modal .jp-perd { border: 0; background: transparent; overflow: visible; }
.jp-modal .jp-perd-head { background: transparent; padding: 0 2px 4px; font-size: .75rem; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
.jp-modal .jp-perd-fila { border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 8px; background: #fff; overflow: hidden; grid-template-columns: 1fr 96px 34px; }
.jp-modal .jp-perd-fila input { padding: 12px 10px; }
.jp-modal .jp-perd-pie { padding: 2px 0 8px; border: 0; }
.jp-modal .jp-perd-total { border: 1px solid #f3e6a8; border-radius: 10px; }
@media (max-width: 420px) {
  .pl-fila, .pl-kpis { gap: 8px; }
  .pl-sec-b { padding: 10px; }
  .jp-modal { padding: 14px; }
  .jp-modal .jp-perd-fila { grid-template-columns: 1fr 80px 30px; }
}

    </style>
</head>

    <!-- CONTENIDO ESPECÍFICO DE LA PÁGINA -->

                <h1>Seguimiento a la Perforación</h1>

            <a class="jp-menu-link" href="../index.html">Menú principal</a>

        <div id="toolbar"></div>

        <section class="jp-paso" id="paso"></section>

    <!-- Librería para generar el Excel (.xlsx) -->
    <script src="../js/vendor/exceljs.min.js"></script>

    <script>
/* ===================== NÚCLEO DE DATOS (listas, columnas, cálculos, almacenamiento) ===================== */
/* =========================================================
   JEJ · Núcleo de datos (listas, columnas, cálculos, almacenamiento)
   Si necesitas cambiar una lista desplegable, edítala en LISTAS.
   ========================================================= */
(function (root) {
  'use strict';

  var KEY = 'jej_app_v1';

  /* ---------- Listas desplegables ---------- */
  var LISTAS = {
    turno:      ['A', 'B', 'Especial'],
    siNo:       ['Si', 'No'],
    nivel:      ['NP', 'UCL', 'Panel 2'],
    bloque:     ['B-2', 'B-6', 'Ext Fw', 'DHz'],
    fase:       ['1', '1 2/3', '2', '3', '4'],
    problemas:  ['Barra Pegada', 'Repasos', 'Cambio Bit', 'Cambio Barras', 'Equipo fuera servicio'],
    // Estas dos no venían en tu Excel: ajústalas a tu criterio de terreno
    estadoTiro: ['Bueno', 'Tapado', 'Colapsado', 'Desviado', 'Obstruido'],
    signo:      ['Negativo', 'Positivo']
  };

  /* ---------- Definición de columnas del registro por tiro ---------- */
  // type: text | num | select | time | calc ; unit = unidad que se muestra al preguntar el dato
  var COLS = {
    perf: [

  // Varios nombres en un mismo campo (se guardan separados por " / ")
  function multiInput(host, label, k, draft, textoAdd) {
    var vals = partes(draft[k]); if (!vals.length) vals = [''];
    var dl = datalist(k, true), box = el('div');
    function sync() { draft[k] = vals.map(function (x) { return x.trim(); }).filter(Boolean).join(' / '); }
    function pintar(enfocarUltimo) {
      box.innerHTML = '';
      vals.forEach(function (v, i) {
        var inp = el('input', { type: 'text', class: 'jp-in', placeholder: 'Seleccione o escriba...', value: v, list: dl.id });
        inp.addEventListener('input', function () { vals[i] = inp.value; sync(); });
        var fila = el('div', { class: 'jp-multi' }, [inp]);
        if (vals.length > 1) fila.appendChild(el('button', { type: 'button', class: 'jp-x', title: 'Quitar', text: '×', onclick: function () { vals.splice(i, 1); sync(); pintar(); } }));
        box.appendChild(fila);
        if (enfocarUltimo && i === vals.length - 1) setTimeout(function () { try { inp.focus(); } catch (e) { /* sin foco */ } }, 0);
      });
      box.appendChild(el('button', { type: 'button', class: 'jp-chip', text: '+ ' + textoAdd, onclick: function () { vals.push(''); pintar(true); } }));
    }
    pintar();
    host.appendChild(el('div', { class: 'jp-mf full' }, [el('label', { text: label }), dl, box]));
  }

  /* ---------- Modal: datos de plantilla (horarios, equipo, labor, pérdidas) ---------- */
  function normalizarTiempo(v) {
    v = String(v).trim(); if (!v) return '';
    var mm = v.match(/^(\d{1,2}):(\d{1,2})$/);
    if (mm) return ('0' + mm[1]).slice(-2) + ':' + ('0' + mm[2]).slice(-2);
    if (/^\d+$/.test(v)) return J.fmtHM(+v);   // 90 -> 01:30 (minutos)
    return null;
  }
  function modalPlantilla() {
    var p = P(), d = {}, perd = p.perdidas.map(function (x) { return { desc: x.desc, tiempo: x.tiempo }; });
    ['hLlegJej', 'hSalJej', 'hLlegPyt', 'hSalPyt', 'hIniPerf', 'hFinPerf', 'diametro', 'idEquipo', 'numZanja', 'calleZanja1', 'calleZanja2', 'fase', 'calleUcl', 'paradaIni', 'paradaFin']
      .forEach(function (k) { d[k] = p.header[k] || ''; });
    if (!perd.length) perd.push({ desc: '', tiempo: '' });

    abrirModal('Completar Datos de Plantilla (Horarios y Operación)', function (m) {
      /* helpers de diseño */
      function sec(icono, titulo, cls) {
        var body = el('div', { class: 'pl-sec-b' });
        var box = el('div', { class: 'pl-sec ' + (cls || '') }, [el('div', { class: 'pl-sec-h' }, [el('span', { text: icono }), el('span', { text: titulo })]), body]);
        m.appendChild(box);
        return body;
      }
      function campoPl(label, ctrl, extra) {
        var l = el('div', { class: 'pl-l' }, [el('span', { text: label })]);
        if (extra) l.appendChild(extra);
        return el('div', { class: 'pl-f' }, [l, ctrl]);
      }
      function horaPl(label, k) {
        var inp = hora(d, k, calcs);
        var ahora = el('button', { type: 'button', class: 'pl-ahora', text: 'Ahora', title: 'Poner la hora actual', onclick: function () {
          var n = new Date(); inp.value = ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2);
          d[k] = inp.value; calcs();
        } });
        return campoPl(label, inp, ahora);
      }
      function fila(hijos) { return el('div', { class: 'pl-fila' }, hijos); }

      /* 1. Horarios */
      var oPost = el('output', { text: J.fmtHM(J.tPostura(d)) });
      var oPerf = el('output', { text: J.fmtHM(J.tPerforacion(d)) });

      s1.appendChild(el('div', { class: 'pl-grupo', text: '🚜 Postura JeJ' }));
      s1.appendChild(fila([horaPl('Llegada', 'hLlegJej'), horaPl('Salida', 'hSalJej')]));
      s1.appendChild(el('div', { class: 'pl-grupo', text: '🧨 Postura PyT' }));
      s1.appendChild(fila([horaPl('Llegada', 'hLlegPyt'), horaPl('Salida', 'hSalPyt')]));
      s1.appendChild(el('div', { class: 'pl-grupo', text: '⛏️ Perforación' }));
      s1.appendChild(fila([horaPl('Inicio', 'hIniPerf'), horaPl('Fin', 'hFinPerf')]));
      s1.appendChild(el('div', { class: 'pl-kpis' }, [
        el('div', { class: 'pl-kpi' }, [el('span', { text: 'Tiempo en Postura' }), oPost]),
        el('div', { class: 'pl-kpi' }, [el('span', { text: 'Tiempo en Perforación' }), oPerf])
      ]));

      /* 2. Equipo */
      var s2 = sec('🛠️', '2. Equipo de Perforación', 'vd');
      var tDiam = txt(d, 'diametro', 'Ej. 3.5'); tDiam.setAttribute('inputmode', 'decimal');
      s2.appendChild(fila([
        campoPl('Diámetro [pulg]', tDiam),
        campoPl('ID del Equipo', txt(d, 'idEquipo', 'Ej. EQ-01'))
      ]));

      /* 3. Labor */
      var s3 = sec('📍', '3. Zanja, Fase y Paradas', 'am');
      var c1 = txt(d, 'calleZanja1', 'Ej. 41'), c2 = txt(d, 'calleZanja2', 'Ej. 43');
      s3.appendChild(fila([
        campoPl('Núm. Zanja', txt(d, 'numZanja', 'Ej. Z-01')),
        campoPl('Calles Zanja (entre)', el('div', { class: 'pl-y' }, [c1, el('i', { text: 'y' }), c2]))
      ]));
      s3.appendChild(fila([
        campoPl('Fase', sel(d, 'fase', 'fase', '-- Seleccione --')),
        campoPl('Calle UCL', txt(d, 'calleUcl', 'Ej. UCL-01'))
      ]));
      s3.appendChild(fila([
        campoPl('Parada Inicial', txt(d, 'paradaIni', 'Ej. P1')),
        campoPl('Parada Final (neg)', txt(d, 'paradaFin', 'Ej. P5'))
      ]));

      /* 4. Pérdida operacional */
      var s4 = sec('⚠️', '4. Pérdida Operacional Durante la Perforación', 'rj');
      s4.appendChild(el('p', { class: 'pl-sec-n', text: 'Observación y tiempo (hh:mm). Si escribes solo minutos, por ejemplo 90, se convierte a 01:30.' }));
      var dl = el('datalist', { id: 'dl-problemas' });
      J.LISTAS.problemas.forEach(function (v) { dl.appendChild(el('option', { value: v })); });
      var caja = el('div', { class: 'jp-perd' });
      var total = el('div', { class: 'jp-perd-total' });
      function actualizarTotal() {
        var mins = J.totalPerdidas({ perdidas: perd });
        total.innerHTML = '';
        total.appendChild(document.createTextNode('Total pérdida operacional: ' + J.fmtHM(mins)));
      }
      function pintarPerd() {
        caja.innerHTML = '';
        caja.appendChild(el('div', { class: 'jp-perd-head' }, [el('span', { text: 'Observación' }), el('span', { text: 'Tiempo', style: 'text-align:center' }), el('span')]));
        perd.forEach(function (x, i) {

          var tt = el('input', { type: 'text', class: 't', value: x.tiempo || '', placeholder: 'hh:mm', maxlength: 5, inputmode: 'numeric', 'aria-label': 'Tiempo perdido (hh:mm)' });
          dd.addEventListener('input', function () { x.desc = dd.value; });
          tt.addEventListener('input', function () { x.tiempo = tt.value; actualizarTotal(); });
          tt.addEventListener('blur', function () {
            var v = normalizarTiempo(tt.value);
            if (v === null) { tt.value = ''; x.tiempo = ''; } else { tt.value = v; x.tiempo = v; }
            actualizarTotal();
          });
          var del = el('button', { type: 'button', class: 'jp-x', title: 'Quitar', text: '×', onclick: function () { perd.splice(i, 1); if (!perd.length) perd.push({ desc: '', tiempo: '' }); pintarPerd(); } });
          caja.appendChild(el('div', { class: 'jp-perd-fila' }, [dd, tt, del]));
        });
        caja.appendChild(el('div', { class: 'jp-perd-pie' }, [el('button', { type: 'button', class: 'jp-btn', text: '＋ Agregar pérdida', onclick: function () { perd.push({ desc: '', tiempo: '' }); pintarPerd(); } })]));
        caja.appendChild(total);
        actualizarTotal();
      }
      pintarPerd();
      s4.appendChild(dl); s4.appendChild(caja);
    }, function () {
      var bad = false;
      perd.forEach(function (x) { if (x.tiempo && normalizarTiempo(x.tiempo) === null) bad = true; });
      if (bad) { alert('Revisa los tiempos de pérdida: usa el formato hh:mm.'); return false; }
      Object.keys(d).forEach(function (k) { p.header[k] = d[k]; });
      p.perdidas = perd.filter(function (x) { return x.desc || x.tiempo; }).map(function (x) { return { desc: x.desc, tiempo: normalizarTiempo(x.tiempo) || '' }; });
      J.store.touch(); render();
    });
  }

          el('div', { class: 'jp-parada-b' }, [
            el('button', { type: 'button', class: 'jp-b editar chico', text: '✏️ Editar', onclick: function () { ui.parada = par; ir('parada'); } }),
            el('button', { type: 'button', class: 'jp-b rojo chico', title: 'Eliminar parada', text: '🗑️', onclick: function () {
              if (!confirm('¿Eliminar la parada "' + par + '" con sus ' + rows.length + ' tiro(s)?')) return;
              p.filas = p.filas.filter(function (r) { return !(r.trabajo === t && String(r.parada) === par); });
              J.store.touch(); render();
            } })
          ])
        ]));
      });
    }
    busca.addEventListener('input', function () { ui.busca = busca.value; pintarLista(); });
    pintarLista();
    card.appendChild(el('div', { class: 'jp-panel' }, [caja]));

    /* agregar parada */
    if (ui.nuevaParada) {
      var np = el('input', { type: 'text', class: 'jp-in', placeholder: 'Ej. P1', value: sugerirParada(p), 'aria-label': 'Número de parada' });
      var e1 = el('div', { class: 'jp-q-error' });
      var crearParada = function () {
        var v = np.value.trim();
        if (!v) { e1.textContent = 'Escribe el número o nombre de la parada.'; return; }
        ui.parada = v; ui.nuevaParada = false;
        if (tirosDe(p, t, v).length) { ir('parada'); return; }
        nuevoTiro(p);
      };
      np.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); crearParada(); } });
      card.appendChild(el('div', { class: 'jp-panel' }, [
        el('div', { class: 'jp-panel-t', text: '📍 NUEVA PARADA:' }), np, e1,
        el('div', { class: 'jp-fila2', style: 'margin-top:10px' }, [
          el('button', { type: 'button', class: 'jp-b verde', text: 'Crear y registrar tiro', onclick: crearParada }),
          el('button', { type: 'button', class: 'jp-b gris', text: 'Cancelar', onclick: function () { ui.nuevaParada = false; render(); } })
        ])
      ]));
      setTimeout(function () { try { np.focus(); np.select(); } catch (e) { /* sin foco */ } }, 0);
    } else {
      card.appendChild(el('button', { type: 'button', class: 'jp-b cel', style: 'margin-top:12px', text: '+ Agregar parada', onclick: function () { ui.nuevaParada = true; ui.aviso = ''; render(); } }));
    }

    card.appendChild(el('div', { class: 'jp-pila' }, [
      el('div', { class: 'jp-fila2', style: 'margin-top:0' }, [
        el('button', { type: 'button', class: 'jp-b cel', text: '+ Registrar Otro ID de Trabajo', onclick: function () { ir('id'); } }),
        el('button', { type: 'button', class: 'jp-b nar', text: '📝 Agregar Observación', onclick: modalObs })
      ]),
      el('button', { type: 'button', class: 'jp-b teal', text: '📋 Rellenar Datos Faltantes de Plantilla (Horarios/Operación)', onclick: modalPlantilla }),
      bloqueDescarga(p)
    ]));
    host.appendChild(card);
  }

  /* ---------- Tiros de una parada (dato por dato) ---------- */
  function camposTiro(row) {
    return J.COLS.perf.filter(function (c) {
      if (c.type === 'calc' || c.sinCaptura || c.k === 'parada') return false;
      if (c.k === 'alturaBarra' && row.problema !== 'Barra Pegada') return false; // solo si hubo barra pegada
      return true;
    });
  }
  function filaAnterior(p, row) {
    var rows = tirosDe(p, row.trabajo, row.parada), i = rows.indexOf(row);
    return i > 0 ? rows[i - 1] : null;
  }
  function calcTexto(c, row) {
    if (c.k === 'mPerf') {
      if (isNaN(J.num(row.mDiseno)) || isNaN(J.num(row.mPerf))) return 'Cumplimiento para carga de diseño: —';
      return 'Cumplimiento para carga de diseño: ' + Math.round(J.calc.cumpl(row) * 100) + '%';
    }
    if (c.k === 'hFin') {
      var t = J.calc.tTiro(row);
      return 'Tiempo de perforación del tiro: ' + (isNaN(t) ? '—' : J.fmt(t, 1) + ' min');
    }
    return null;
  }
  function nombreTiro(row) {
    return (row.parada ? 'Parada ' + row.parada : 'Parada s/n') + ' · Tiro ' + (row.tiro || 's/n');
  }

  function nuevoTiro(p) {
    var t = p.trabajoActual, rows = tirosDe(p, t, ui.parada), last = rows[rows.length - 1], r = J.store.filaVaciaPerf();
    r.trabajo = t; r.parada = ui.parada;
    if (last && /^\d+$/.test(String(last.tiro).trim())) r.tiro = String(parseInt(last.tiro, 10) + 1);
    // el tiro se inserta junto a los de su parada (o de su trabajo) para que el Excel quede ordenado
    var ref = last || tirosDe(p, t).slice(-1)[0], idx = ref ? p.filas.indexOf(ref) + 1 : p.filas.length;
    p.filas.splice(idx, 0, r); J.store.touch();
    ui.tiro = { row: r, nuevo: true, i: 0, err: '' }; ui.aviso = ''; ui.vista = 'parada';
    render();
  }
  function editarTiro(p, row) { ui.tiro = { row: row, nuevo: false, i: 0, err: '' }; ui.aviso = ''; render(); }
  function cancelarTiro(p) {
    var t = ui.tiro;
    if (t.nuevo) { var i = p.filas.indexOf(t.row); if (i >= 0) p.filas.splice(i, 1); }
    ui.tiro = null; ui.aviso = ''; J.store.touch();
    if (!tirosDe(p, p.trabajoActual, ui.parada).length) ui.vista = 'resumen';
    render();
  }
  function terminarTiro(p) {
    ui.aviso = nombreTiro(ui.tiro.row) + ' guardado. Puedes registrar otro tiro o volver al resumen de paradas.';
    ui.tiro = null; J.store.touch(); render();
  }
  function avanzar(p) {
    var t = ui.tiro, cs = camposTiro(t.row), c = cs[t.i];
    if (c.type === 'num') {
      var v = t.row[c.k];
      if (v !== '' && isNaN(J.num(v))) { t.err = 'Ingresa un número (puedes usar coma o punto).'; render(); return; }
    }
    t.err = '';
    if (t.i >= cs.length - 1) { terminarTiro(p); return; }
    t.i++; render();
  }
  function retroceder() {
    var t = ui.tiro; t.err = '';
    if (t.i > 0) { t.i--; render(); }
  }

  function preguntaTiro(host, p) {
    var t = ui.tiro, row = t.row, cs = camposTiro(row);
    if (t.i > cs.length - 1) t.i = cs.length - 1;
    var c = cs[t.i], prev = filaAnterior(p, row);
    var q = el('div', { class: 'jp-q', style: 'border-left-color:#' + c.bg });

    var salto = el('select', { 'aria-label': 'Ir a otro dato' });
    cs.forEach(function (x, i) { var o = el('option', { value: String(i), text: (i + 1) + '. ' + x.label }); if (i === t.i) o.selected = true; salto.appendChild(o); });
    salto.addEventListener('change', function () { t.i = +salto.value; t.err = ''; render(); });
    q.appendChild(el('div', { class: 'jp-q-top' }, [el('b', { text: nombreTiro(row) }), el('span', { text: 'Dato ' + (t.i + 1) + ' de ' + cs.length }), salto]));
    q.appendChild(el('div', { class: 'jp-q-barra' }, [el('i', { style: 'width:' + Math.round((t.i + 1) / cs.length * 100) + '%' })]));
    q.appendChild(el('h3', { text: c.label }));
    if (c.k === 'problema') q.appendChild(el('p', { class: 'jp-q-ayuda', text: 'Si no hubo problemas, toca «Sin problemas».' }));
    if (c.k === 'alturaBarra') q.appendChild(el('p', { class: 'jp-q-ayuda', text: 'Se pregunta porque el problema fue barra pegada.' }));

    var calcBox = null, ct = calcTexto(c, row);
    function actualizarCalc() { if (calcBox) calcBox.textContent = calcTexto(c, row); }
    var inp = null;

    if (c.type === 'select') {
      var opts = el('div', { class: 'jp-opts' });
      J.LISTAS[c.list].forEach(function (v) {
        opts.appendChild(el('button', { type: 'button', class: 'jp-opt' + (row[c.k] === v ? ' sel' : ''), text: v, onclick: function () {
          row[c.k] = v;
          if (c.k === 'problema' && v !== 'Barra Pegada') row.alturaBarra = '';
          J.store.touch(); avanzar(p);
        } }));
      });
      q.appendChild(opts);
    } else {
      inp = el('input', { type: c.type === 'time' ? 'time' : 'text', value: row[c.k] || '', 'aria-label': c.label });
      if (c.type === 'num') inp.setAttribute('inputmode', 'decimal');
      inp.addEventListener('input', function () { row[c.k] = inp.value; t.err = ''; J.store.touch(); actualizarCalc(); });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); avanzar(p); } });
      q.appendChild(el('div', { class: 'jp-q-input' }, [inp, c.unit ? el('span', { class: 'u', text: c.unit }) : null]));
    }
    if (ct !== null) { calcBox = el('div', { class: 'jp-q-calc', text: ct }); q.appendChild(calcBox); }
    if (t.err) q.appendChild(el('div', { class: 'jp-q-error', text: t.err }));

    // Atajo: repetir el valor del tiro anterior de la misma parada
    var pv = prev ? (c.k === 'hIni' ? prev.hFin : prev[c.k]) : '';
    if (pv && !row[c.k] && c.k !== 'tiro') {
      q.appendChild(el('div', { style: 'margin-top:6px;text-align:center' }, [el('button', { type: 'button', class: 'jp-chip',
        text: (c.k === 'hIni' ? 'Usar hora de término del tiro anterior: ' : 'Usar el del tiro anterior: ') + pv,
        onclick: function () { row[c.k] = pv; J.store.touch(); render(); } })]));
    }

    var acc = el('div', { class: 'jp-q-acciones' }, [
      el('button', { type: 'button', class: 'jp-btn', text: '← Anterior', disabled: t.i === 0 ? 'disabled' : null, onclick: retroceder }),
      el('button', { type: 'button', class: 'jp-btn', text: c.k === 'problema' ? 'Sin problemas' : 'Omitir', onclick: function () {
        row[c.k] = ''; if (c.k === 'problema') row.alturaBarra = ''; J.store.touch(); avanzar(p);
      } }),
      el('button', { type: 'button', class: 'jp-btn jp-btn-primary', text: t.i >= cs.length - 1 ? '✔ Guardar tiro' : 'Siguiente →', onclick: function () { avanzar(p); } }),
      el('span', { class: 'jp-sep' }),
      el('button', { type: 'button', class: 'jp-btn jp-btn-danger', text: t.nuevo ? 'Cancelar tiro' : 'Cerrar', onclick: function () { if (t.nuevo) { if (confirm('¿Cancelar este tiro? Se descartan los datos ingresados.')) cancelarTiro(p); } else { terminarTiro(p); } } })
    ]);
    q.appendChild(acc);

    // Lo ya ingresado en este tiro
    var llenos = cs.filter(function (x) { return row[x.k] !== '' && x.k !== c.k; });
    if (llenos.length) {
      q.appendChild(el('div', { class: 'jp-q-resumen' }, llenos.map(function (x) {
        return el('span', { text: x.label.replace(/ \[.*\]$/, '') + ': ' + row[x.k] });
      })));
    }
    host.appendChild(q);
    if (inp) setTimeout(function () { try { inp.focus(); if (inp.select) inp.select(); } catch (e) { /* sin foco */ } }, 0);
  }

  function vistaParada(host, p) {
    if (ui.tiro) { preguntaTiro(host, p); return; }
    var t = p.trabajoActual, par = ui.parada, filas = tirosDe(p, t, par), card = el('div', { class: 'jp-card ancha' });
    card.appendChild(el('h2', { class: 'jp-card-t', text: '📍 Parada: ' + par }));
    card.appendChild(el('p', { class: 'jp-card-sub', text: 'Trabajo: ' + t + ' · Cada tiro se registra dato por dato. Enter o «Siguiente» avanza; en las listas basta con tocar la opción.' }));
    if (ui.aviso) card.appendChild(el('div', { class: 'jp-aviso', text: ui.aviso }));
    if (!filas.length) {
      card.appendChild(el('div', { class: 'jp-vacio', text: 'Aún no hay tiros en esta parada. Toca «Agregar tiro».' }));
    } else {
      var tb = el('tbody'), mDis = 0, mPerf = 0, sc = 0, nc = 0;
      filas.forEach(function (r) {
        var d = J.num(r.mDiseno), m = J.num(r.mPerf);
        if (!isNaN(d)) mDis += d; if (!isNaN(m)) mPerf += m;
        if (!isNaN(d) && !isNaN(m)) { sc += J.calc.cumpl(r); nc++; }
        tb.appendChild(el('tr', null, [
          el('td', { text: r.tiro || '—' }), el('td', { text: r.mDiseno || '—' }), el('td', { text: r.mPerf || '—' }),
          el('td', { text: r.mDiseno && r.mPerf ? Math.round(J.calc.cumpl(r) * 100) + '%' : '—' }),
          el('td', { text: r.abat ? r.abat + '°' : '—' }), el('td', { text: r.estado || '—' }), el('td', { text: r.problema || '—' }),
          el('td', null, [el('div', { class: 'acc' }, [
            el('button', { type: 'button', class: 'jp-link', text: 'Editar', onclick: function () { editarTiro(p, r); } }),
            el('button', { type: 'button', class: 'jp-x', title: 'Eliminar tiro', text: '×', onclick: function () {
              if (confirm('¿Eliminar ' + nombreTiro(r) + '?')) {
                p.filas.splice(p.filas.indexOf(r), 1); J.store.touch(); ui.aviso = '';
                if (!tirosDe(p, t, par).length) ui.vista = 'resumen';
                render();
              }
            } })
          ])])
        ]));
      });
      var tf = el('tfoot', null, [el('tr', null, [el('td', { text: 'Total' }), el('td', { text: J.fmt(mDis, 1) }), el('td', { text: J.fmt(mPerf, 1) }), el('td', { text: pctTxt(nc ? sc / nc : NaN) }), el('td', { colspan: '4' })])]);
      card.appendChild(el('div', { class: 'jp-scroll sin-scroll' }, [el('table', { class: 'jp-tabla-simple jp-tabla-tiros' }, [
        el('thead', null, [el('tr', null, ['Tiro', 'Diseño [m]', 'Perforado [m]', 'Cumpl.', 'Abat.', 'Estado', 'Problema', ''].map(function (x) { return el('th', { text: x }); }))]),
        tb, tf])]));
    }
    card.appendChild(el('button', { type: 'button', class: 'jp-b verde', text: '＋ Agregar tiro', onclick: function () { nuevoTiro(p); } }));
    card.appendChild(el('button', { type: 'button', class: 'jp-b gris', style: 'margin-top:10px', text: '← Volver al Resumen de Paradas', onclick: function () { ir('resumen'); } }));
    host.appendChild(card);
  }

  /* ---------- Finalizar: resumen y descargas ---------- */
  function vistaFinal(host, p) {
    var R = J.resumen(p), card = el('div', { class: 'jp-card' });
    card.appendChild(el('h2', { class: 'jp-card-t', text: 'Registro Completo' }));
    card.appendChild(el('p', { class: 'jp-card-sub', text: 'Registro guardado en este dispositivo. Descarga la planilla y el informe técnico.' }));
    card.appendChild(el('div', { class: 'jp-kpis' }, [
      [R.nTiros, 'tiros registrados'], [p.trabajos.length, 'ID(s) de trabajo'], [R.paradas.length, 'paradas'],
      [J.fmt(R.mDis, 1) + ' m', 'metros de diseño'], [J.fmt(R.mPerf, 1) + ' m', 'metros perforados'],
      [pctTxt(R.cumplProm), 'cumplimiento prom. carga de diseño'],
      [J.fmtHM(R.tPerf), 'tiempo en perforación'], [J.fmtHM(R.tPerdidas), 'pérdida operacional total']
    ].map(function (k) { return el('div', { class: 'jp-kpi' }, [el('b', { text: String(k[0]) }), el('span', { text: k[1] })]); })));
    var s = el('select', { class: 'jp-in', 'aria-label': 'Referencia del abatimiento' }, [
      el('option', { value: 'horizontal', text: 'horizontal' }), el('option', { value: 'vertical', text: 'vertical' })]);
    s.value = p.refAbat || 'horizontal';
    s.addEventListener('change', function () { p.refAbat = s.value; J.store.touch(); });
    card.appendChild(el('label', { class: 'jp-lbl', text: 'Para los diagramas de disparo, el abatimiento se mide desde la:' }));
    card.appendChild(s);
    card.appendChild(el('div', { class: 'jp-pila', style: 'margin-top:18px' }, [
      el('button', { type: 'button', class: 'jp-b azul', text: '⬇ Descargar Excel', onclick: function () { J.store.saveNow(); J.excel.download(p); } }),
      el('button', { type: 'button', class: 'jp-b azul', text: '⬇ Descargar Informe Técnico', onclick: function () { J.store.saveNow(); J.informe.abrir(p); } }),
      el('button', { type: 'button', class: 'jp-b gris', text: '← Volver al Resumen de Paradas', onclick: function () { ir('resumen'); } })
    ]));
    host.appendChild(card);
  }

  /* ---------- Navegación y render ---------- */
  function descartarTiroVacio(p) {
    if (ui.tiro && ui.tiro.nuevo) {
      var t = ui.tiro, vacio = J.COLS.perf.every(function (c) { return c.type === 'calc' || c.k === 'parada' || c.k === 'tiro' || c.k === 'trabajo' || !t.row[c.k]; });
      if (vacio) { var i = p.filas.indexOf(t.row); if (i >= 0) p.filas.splice(i, 1); }
    }
  }
  function ir(v) {
    descartarTiroVacio(P());
    ui.tiro = null; ui.aviso = ''; ui.vista = v;
    render(); window.scrollTo(0, 0);
  }
  var VISTAS = { datos: vistaDatos, id: vistaId, resumen: vistaResumen, parada: vistaParada, final: vistaFinal };
  function render() {
    var p = P(), host = U.$('#paso'); host.innerHTML = '';
    if (!p.trabajoActual && (ui.vista === 'resumen' || ui.vista === 'parada' || ui.vista === 'final')) ui.vista = 'id';
    if (ui.vista === 'parada' && !ui.parada) ui.vista = 'resumen';
    VISTAS[ui.vista](host, p);
  }

  /* ---------- Arranque ---------- */
  refrescarToolbar();
  render();
  window.addEventListener('beforeunload', function () { J.store.saveNow(); });
})();
    </script>
    <script>
        if (typeof cargarBarMenu === 'function') cargarBarMenu(true); // true = está en una subcarpeta (pages/)
    </script>
</body>
